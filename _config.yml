# Site settings

# NB! Set your site's url, otherwise nothing will work.
# Replace ORG and REPO with your actual GitHub org/repo names.
url: "https://igem-prague.github.io"
baseurl: ""

# Google tracking id. GA + cookie banner are currently commented out in
# _includes/head.html; uncomment there and set the id to enable.
google-tracking-id: ""

#############
# HTML Head #
#############

lang: "en"
author: "iGEM Prague Team"
title: "iGEM Prague"
description: "TODO description"
keywords: "iGEM team, synthetic biology, bioengineering, microalgae, space"
favicon: "/img/favicon.ico"

################
# Header layout#
################

background-img: "/img/background.jpg"

# Logo in the header of the main page and year pages.
# The text typed above it is set in _sections/index.md (main page)
# and _sections/<year>/index.md (year pages).
me-img: "/img/team-logo.webp"

########
# News #
########

# Length of post previews in the News section of a year page
post-preview-words: 50
email-share: True
fb-share: True
linkedin-share: True
reddit-share: True
x-share: True
hackernews-share: False
tumblr-share: False
pinterest-share: False
pocket-share: False
vkontakte-share: False

############
# Timeline #
############

# Timeline entries are in _sections/timeline.md.

###########
# Contact #
###########

email: "igemteamprague@gmail.com"

################
# Author Blurb #
################

# This text appears underneath each blog post.
author_blurb_image: "/img/team-logo.webp"
author_blurb:
  "TODO author blurb"

##################
# Social Buttons #
##################

social:
  - icon: "github"
    url: "https://github.com/iGEM-Prague/"
  - icon: "instagram"
    url: "https://www.instagram.com/igem_prague/"
  # - icon: "x-twitter"
  #   url: "https://twitter.com/your-team"
  # - icon: "rss"
  #   url: "https://your-org.github.io/your-repo-name/feed.xml"

# NB! Tread carefully if you want to change the variables below this point!

syntax_theme: everforest

# Page sections: _sections/*.md for the main page, _sections/<year>/*.md for
# year pages. Not written as standalone pages; each section is rendered through
# _includes/sections/<file name>.html. Order is set in the folder's index.md.
collections:
  sections:
    output: false

# News posts: _posts/<year>/en/YYYY-MM-DD-title.md end up at /<year>/news/MM/DD/title/,
# Czech ones in _posts/<year>/cs/ at /<year>/news/MM/DD/title/cs/. Same file name = translations.
defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
      lang: "en"
      permalink: "/:year/news/:month/:day/:title/"
  - scope:
      path: "_posts/*/cs"
      type: "posts"
    values:
      lang: "cs"
      permalink: "/:year/news/:month/:day/:title/cs/"

# Exclusion list from the generated _site
exclude:
  - LICENSE
  - README.md
  - Dockerfile
  - docker-compose.yml
  - TODO.md

# Enable minification of SASS
sass:
  style: compressed

