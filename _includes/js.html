<script>
  // Toggle navbar background on scroll
  function toggleNavCollapse() {
    const navbar = document.querySelector(".navbar");
    const fixedTop = document.querySelector(".fixed-top");
    if (navbar && fixedTop) {
      if (navbar.getBoundingClientRect().top + window.scrollY > 50) {
        fixedTop.classList.add("top-nav-collapse");
      } else {
        fixedTop.classList.remove("top-nav-collapse");
      }
    }
  }

  // Header image starts below the navbar: measure its full (not collapsed) height
  function setNavbarHeight() {
    const navbar = document.querySelector(".navbar");
    const stretched =
      parseFloat(document.documentElement.style.getPropertyValue("--nav-stretch")) > 0;
    if (navbar && !navbar.classList.contains("top-nav-collapse") && !stretched) {
      document.documentElement.style.setProperty(
        "--navbar-height",
        navbar.offsetHeight + "px",
      );
    }
  }
  document.addEventListener("DOMContentLoaded", setNavbarHeight);
  window.addEventListener("resize", setNavbarHeight);

  // Pulling the page down at the top stretches the navbar (and pushes the page down
  // with it), then it springs back with a small bounce
  (function () {
    const navbar = document.querySelector(".navbar");
    if (!navbar || window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
    const root = document.documentElement;
    const MAX = 120; // px
    let stretch = 0;
    let releaseTimer = null;
    let animation = null;
    let touchStartY = null;

    function setStretch(px) {
      stretch = Math.max(0, Math.min(px, MAX));
      root.style.setProperty("--nav-stretch", stretch + "px");
    }

    function pull(amount) {
      if (animation) cancelAnimationFrame(animation);
      animation = null;
      navbar.classList.add("nav-stretching");
      // The further it is pulled, the heavier it gets
      setStretch(stretch + amount * (1 - stretch / MAX));
    }

    // Bounce back: fall to 0, then two small hops
    function easeOutBounce(t) {
      const n = 7.5625, d = 2.75;
      if (t < 1 / d) return n * t * t;
      if (t < 2 / d) return n * (t -= 1.5 / d) * t + 0.75;
      if (t < 2.5 / d) return n * (t -= 2.25 / d) * t + 0.9375;
      return n * (t -= 2.625 / d) * t + 0.984375;
    }

    function release() {
      if (stretch <= 0) return;
      const from = stretch;
      const start = performance.now();
      const duration = 700;
      function frame(now) {
        const t = Math.min((now - start) / duration, 1);
        setStretch(from * (1 - easeOutBounce(t)));
        if (t < 1) {
          animation = requestAnimationFrame(frame);
        } else {
          animation = null;
          navbar.classList.remove("nav-stretching");
          root.style.removeProperty("--nav-stretch");
        }
      }
      animation = requestAnimationFrame(frame);
    }

    // Mouse wheel / touchpad
    window.addEventListener(
      "wheel",
      function (e) {
        if (window.scrollY > 0 || e.deltaY >= 0) return;
        pull(-e.deltaY * 0.4);
        clearTimeout(releaseTimer);
        releaseTimer = setTimeout(release, 150);
      },
      { passive: true },
    );

    // Touch screens
    window.addEventListener(
      "touchstart",
      function (e) {
        touchStartY = window.scrollY <= 0 ? e.touches[0].clientY : null;
      },
      { passive: true },
    );
    window.addEventListener(
      "touchmove",
      function (e) {
        if (touchStartY === null || window.scrollY > 0) return;
        const dy = e.touches[0].clientY - touchStartY;
        touchStartY = e.touches[0].clientY;
        if (dy > 0 || stretch > 0) pull(dy * 0.5);
      },
      { passive: true },
    );
    window.addEventListener("touchend", function () {
      touchStartY = null;
      release();
    });
  })();
  document.addEventListener("DOMContentLoaded", toggleNavCollapse);
  window.addEventListener("scroll", toggleNavCollapse);

  // Smooth scrolling for page-scroll links
  document.addEventListener("DOMContentLoaded", function () {
    // Custom smooth scroll with easing
    function smoothScrollTo(targetPosition, duration) {
      const startPosition = window.scrollY;
      const distance = targetPosition - startPosition;
      let startTime = null;

      function easeOutCubic(t) {
        return 1 - Math.pow(1 - t, 3);
      }

      function animation(currentTime) {
        if (startTime === null) startTime = currentTime;
        const elapsed = currentTime - startTime;
        const progress = Math.min(elapsed / duration, 1);
        const easeProgress = easeOutCubic(progress);

        window.scrollTo(0, startPosition + distance * easeProgress);

        if (elapsed < duration) {
          requestAnimationFrame(animation);
        }
      }

      requestAnimationFrame(animation);
    }

    document.querySelectorAll("a.page-scroll").forEach(function (link) {
      link.addEventListener("click", function (e) {
        const href = this.getAttribute("href");
        const target = document.querySelector(href);
        if (target) {
          e.preventDefault();
          const targetPosition =
            target.getBoundingClientRect().top + window.scrollY - 50;
          smoothScrollTo(targetPosition, 800);
          this.blur();
        }
      });
    });

    // Close navbar when a nav link is clicked (mobile)
    document
      .querySelectorAll(".navbar-collapse ul li a")
      .forEach(function (link) {
        link.addEventListener("click", function () {
          const toggler = document.querySelector(".navbar-toggler");
          if (toggler && window.getComputedStyle(toggler).display !== "none") {
            toggler.click();
          }
        });
      });
  });
</script>

<!-- Collapse navbar when clicked outside of it -->

<script>
  document.addEventListener("click", function (event) {
    const navbar = document.querySelector(".navbar-collapse");
    const isClickInsideNavbar = navbar.contains(event.target);
    const isNavbarOpen = navbar.classList.contains("show");

    if (!isClickInsideNavbar && isNavbarOpen) {
      const collapseInstance =
        bootstrap.Collapse.getInstance(navbar) ||
        new bootstrap.Collapse(navbar);
      collapseInstance.hide();
    }
  });
</script>

<!-- Theme toggle -->

<script>
  (function () {
    var btn = document.getElementById("theme-toggle");
    if (!btn) return;
    btn.addEventListener("click", function () {
      var next =
        document.documentElement.getAttribute("data-theme") === "dark"
          ? "light"
          : "dark";
      document.documentElement.setAttribute("data-theme", next);
      try {
        localStorage.setItem("theme", next);
      } catch (e) {}
    });
  })();
</script>

<!-- Language toggle (works like the theme toggle; the initial language is set in head.html) -->

<script>
  (function () {
    var btn = document.getElementById("lang-toggle");
    if (!btn) return;
    btn.addEventListener("click", function () {
      var next =
        document.documentElement.getAttribute("data-lang") === "cs" ? "en" : "cs";
      try {
        localStorage.setItem("lang", next);
      } catch (e) {}
      // On a post with a translation, go to the translated post
      var translation = window.pageTranslations && window.pageTranslations[next];
      if (translation) {
        window.location.href = translation;
        return;
      }
      document.documentElement.setAttribute("data-lang", next);
      document.documentElement.lang = next;
      document.dispatchEvent(new CustomEvent("langchange", { detail: next }));
    });
  })();
</script>

<script type="text/javascript">
  document.addEventListener("DOMContentLoaded", function () {
    // header-text: one phrase, a list of phrases, or {en: ..., cs: ...} with those;
    // a random phrase of the current language is typed, again after switching language
    var headerText = {{ header_text | jsonify }};
    var typed;
    function typePhrase(delay) {
      var lang = document.documentElement.getAttribute("data-lang") || "en";
      var phrases = headerText;
      if (phrases && !Array.isArray(phrases) && typeof phrases === "object") {
        phrases = phrases[lang] || phrases.en || phrases.cs;
      }
      phrases = [].concat(phrases);
      if (typed) typed.destroy();
      typed = new Typed(".intro-text", {
        strings: [phrases[Math.floor(Math.random() * phrases.length)]],
        typeSpeed: 50,
        startDelay: delay,
        loop: false,
        cursorChar: "|",
      });
    }
    typePhrase(1000);
    document.addEventListener("langchange", function () {
      typePhrase(0);
    });
  });
</script>

<!-- Dynamic Typing End  -->
