<script>
  // Navbar gets compact while scrolling down (tablet and wider): --nav-shrink goes
  // from 0 at the top to 1 after scrolling by the padding it loses, so its bottom
  // edge moves up together with the page content
  function toggleNavCollapse() {
    const root = document.documentElement;
    if (window.innerWidth < 768) {
      root.style.removeProperty("--nav-shrink");
      return;
    }
    const shrinkDistance = 2 * 1.25 * parseFloat(getComputedStyle(root).fontSize);
    const progress = Math.min(Math.max(window.scrollY, 0) / shrinkDistance, 1);
    root.style.setProperty("--nav-shrink", progress.toFixed(3));
    if (progress === 0) setNavbarHeight();
  }

  // Header image starts below the navbar: measure its full (not collapsed) height
  function setNavbarHeight() {
    const navbar = document.querySelector(".navbar");
    const stretched =
      parseFloat(document.documentElement.style.getPropertyValue("--nav-stretch")) > 0;
    if (navbar && window.scrollY <= 0 && !stretched) {
      document.documentElement.style.setProperty(
        "--navbar-height",
        navbar.offsetHeight + "px",
      );
    }
  }
  document.addEventListener("DOMContentLoaded", setNavbarHeight);
  window.addEventListener("resize", setNavbarHeight);

  // Pulling past the top or the bottom of the page stretches the navbar, then it springs
  // back with a small bounce. At the top it pushes the page down with it (--nav-stretch);
  // at the bottom the page stays and only the navbar grows (--nav-stretch-bottom).
  (function () {
    const navbar = document.querySelector(".navbar");
    if (!navbar || window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
    const root = document.documentElement;
    const MAX = 120; // px

    // Bounce back: fall to 0, then two small hops
    function easeOutBounce(t) {
      const n = 7.5625, d = 2.75;
      if (t < 1 / d) return n * t * t;
      if (t < 2 / d) return n * (t -= 1.5 / d) * t + 0.75;
      if (t < 2.5 / d) return n * (t -= 2.25 / d) * t + 0.9375;
      return n * (t -= 2.625 / d) * t + 0.984375;
    }

    function stretcher(cssVar) {
      let stretch = 0;
      let animation = null;
      let releaseTimer = null;
      function set(px) {
        stretch = Math.max(0, Math.min(px, MAX));
        root.style.setProperty(cssVar, stretch + "px");
      }
      function release() {
        if (stretch <= 0) return;
        const from = stretch;
        const start = performance.now();
        function frame(now) {
          const t = Math.min((now - start) / 700, 1);
          set(from * (1 - easeOutBounce(t)));
          if (t < 1) {
            animation = requestAnimationFrame(frame);
          } else {
            animation = null;
            root.style.removeProperty(cssVar);
          }
        }
        animation = requestAnimationFrame(frame);
      }
      // Hitting the edge while scrolling: grow to `target` px, quickly at first and slowing
      // down (as if the navbar resisted), then spring back
      function impact(target, speed) {
        target = Math.min(target, MAX);
        if (target <= stretch + 1) return release();
        if (animation) cancelAnimationFrame(animation);
        const from = stretch;
        const start = performance.now();
        // An ease-out curve starts at 3 * distance / duration px per ms; start close to the
        // scroll's own speed, but take at least 0.2 s and at most 0.4 s
        const duration = Math.min(Math.max((3 * (target - from)) / Math.max(speed, 0.1), 200), 400);
        function frame(now) {
          const t = Math.min((now - start) / duration, 1);
          set(from + (target - from) * (1 - Math.pow(1 - t, 3)));
          if (t < 1) animation = requestAnimationFrame(frame);
          else release();
        }
        animation = requestAnimationFrame(frame);
      }
      return {
        impact: impact,
        value: function () {
          return stretch;
        },
        // The further it is pulled, the heavier it gets
        pull: function (amount) {
          if (animation) cancelAnimationFrame(animation);
          animation = null;
          set(stretch + amount * (1 - stretch / MAX));
        },
        release: release,
        releaseSoon: function () {
          clearTimeout(releaseTimer);
          releaseTimer = setTimeout(release, 150);
        },
      };
    }

    const top = stretcher("--nav-stretch");
    const bottom = stretcher("--nav-stretch-bottom");
    function atTop() {
      return window.scrollY <= 0;
    }
    function atBottom() {
      return window.innerHeight + window.scrollY >= root.scrollHeight - 1;
    }

    function maxScroll() {
      return root.scrollHeight - window.innerHeight;
    }
    function wheelPixels(e) {
      // Some browsers report lines or pages instead of pixels
      return e.deltaY * (e.deltaMode === 1 ? 16 : e.deltaMode === 2 ? window.innerHeight : 1);
    }

    // A scroll that starts in the middle of the page and goes past its edge also stretches
    // the navbar: the part past the edge is kept and used once the page reaches the edge.
    let wheelTarget = null; // where the current wheel scroll would end
    let pendingTop = 0;
    let pendingBottom = 0;
    let wheelTimer = null;

    // Mouse wheel / touchpad
    window.addEventListener(
      "wheel",
      function (e) {
        const delta = wheelPixels(e);
        if (delta < 0 && atTop()) {
          top.pull(-delta * 0.4);
          top.releaseSoon();
        } else if (delta > 0 && atBottom()) {
          bottom.pull(delta * 0.4);
          bottom.releaseSoon();
        } else {
          wheelTarget = (wheelTarget === null ? window.scrollY : wheelTarget) + delta;
          if (wheelTarget < 0) {
            pendingTop += -wheelTarget;
            wheelTarget = 0;
          } else if (wheelTarget > maxScroll()) {
            pendingBottom += wheelTarget - maxScroll();
            wheelTarget = maxScroll();
          }
          clearTimeout(wheelTimer);
          wheelTimer = setTimeout(function () {
            wheelTarget = null;
            pendingTop = pendingBottom = 0;
          }, 1000);
        }
      },
      { passive: true },
    );

    // Reaching the edge: the stretch follows the scroll's speed just before it hit the edge
    // (also momentum after the finger left the touchpad / screen), or the kept wheel
    // distance, whichever is bigger
    // How far the navbar stretches for a given speed (px/ms) or scrolled-past distance (px):
    // grows with it but levels off below MAX (1 px/ms: ~18 px, 4: ~58 px, 8: ~88 px)
    function fromSpeed(speed) {
      return speed > 0 ? MAX * (1 - Math.exp(-speed / 6)) : 0;
    }
    function fromDistance(px) {
      return px > 0 ? MAX * (1 - Math.exp(-px / 800)) : 0;
    }
    let recent = []; // [time, scrollY] of the last ~100 ms
    let lastY = window.scrollY;
    window.addEventListener(
      "scroll",
      function () {
        const y = window.scrollY;
        const now = performance.now();
        recent.push([now, y]);
        while (recent.length > 2 && now - recent[0][0] > 100) recent.shift();
        const velocity = (y - recent[0][1]) / Math.max(now - recent[0][0], 16); // px per ms
        if (y <= 0 && lastY > 0) {
          top.impact(Math.max(fromSpeed(-velocity), fromDistance(pendingTop)), -velocity);
          pendingTop = 0;
          wheelTarget = null;
        } else if (y >= maxScroll() - 1 && lastY < maxScroll() - 1) {
          bottom.impact(Math.max(fromSpeed(velocity), fromDistance(pendingBottom)), velocity);
          pendingBottom = 0;
          wheelTarget = null;
        }
        lastY = y;
      },
      { passive: true },
    );

    // Touch screens
    let touchY = null;
    window.addEventListener(
      "touchstart",
      function (e) {
        touchY = e.touches[0].clientY;
      },
      { passive: true },
    );
    window.addEventListener(
      "touchmove",
      function (e) {
        if (touchY === null) return;
        const dy = e.touches[0].clientY - touchY; // > 0: finger moves down
        touchY = e.touches[0].clientY;
        if (atTop() && (dy > 0 || top.value() > 0)) top.pull(dy * 0.5);
        else if (atBottom() && (dy < 0 || bottom.value() > 0)) bottom.pull(-dy * 0.5);
      },
      { passive: true },
    );
    window.addEventListener("touchend", function () {
      touchY = null;
      top.release();
      bottom.release();
    });
  })();
  document.addEventListener("DOMContentLoaded", toggleNavCollapse);
  window.addEventListener("scroll", toggleNavCollapse);
  window.addEventListener("resize", toggleNavCollapse);

  // Smooth scrolling for page-scroll links
  document.addEventListener("DOMContentLoaded", function () {
    // Custom smooth scroll with easing
    function smoothScrollTo(targetPosition, duration) {
      const startPosition = window.scrollY;
      const distance = targetPosition - startPosition;
      let startTime = null;

      function easeOutCubic(t) {
        return 1 - Math.pow(1 - t, 3);
      }

      function animation(currentTime) {
        if (startTime === null) startTime = currentTime;
        const elapsed = currentTime - startTime;
        const progress = Math.min(elapsed / duration, 1);
        const easeProgress = easeOutCubic(progress);

        window.scrollTo(0, startPosition + distance * easeProgress);

        if (elapsed < duration) {
          requestAnimationFrame(animation);
        }
      }

      requestAnimationFrame(animation);
    }

    document.querySelectorAll("a.page-scroll").forEach(function (link) {
      link.addEventListener("click", function (e) {
        const href = this.getAttribute("href");
        const target = document.querySelector(href);
        if (target) {
          e.preventDefault();
          const targetPosition =
            target.getBoundingClientRect().top + window.scrollY - 50;
          smoothScrollTo(targetPosition, 800);
          this.blur();
        }
      });
    });

    // Close navbar when a nav link is clicked (mobile)
    document
      .querySelectorAll(".navbar-collapse ul li a")
      .forEach(function (link) {
        link.addEventListener("click", function () {
          const toggler = document.querySelector(".navbar-toggler");
          if (toggler && window.getComputedStyle(toggler).display !== "none") {
            toggler.click();
          }
        });
      });
  });
</script>

<!-- Collapse navbar when clicked outside of it -->

<script>
  document.addEventListener("click", function (event) {
    const navbar = document.querySelector(".navbar-collapse");
    const isClickInsideNavbar = navbar.contains(event.target);
    const isNavbarOpen = navbar.classList.contains("show");

    if (!isClickInsideNavbar && isNavbarOpen) {
      const collapseInstance =
        bootstrap.Collapse.getInstance(navbar) ||
        new bootstrap.Collapse(navbar);
      collapseInstance.hide();
    }
  });
</script>

<!-- Theme toggle -->

<script>
  (function () {
    var btn = document.getElementById("theme-toggle");
    if (!btn) return;
    btn.addEventListener("click", function () {
      var next =
        document.documentElement.getAttribute("data-theme") === "dark"
          ? "light"
          : "dark";
      document.documentElement.setAttribute("data-theme", next);
      try {
        localStorage.setItem("theme", next);
      } catch (e) {}
    });
  })();
</script>

<!-- Language toggle (works like the theme toggle; the initial language is set in head.html) -->

<script>
  (function () {
    var btn = document.getElementById("lang-toggle");
    if (!btn) return;
    btn.addEventListener("click", function () {
      var next =
        document.documentElement.getAttribute("data-lang") === "cs" ? "en" : "cs";
      try {
        localStorage.setItem("lang", next);
      } catch (e) {}
      // On a post with a translation, go to the translated post
      var translation = window.pageTranslations && window.pageTranslations[next];
      if (translation) {
        window.location.href = translation;
        return;
      }
      document.documentElement.setAttribute("data-lang", next);
      document.documentElement.lang = next;
      document.dispatchEvent(new CustomEvent("langchange", { detail: next }));
    });
  })();
</script>

<!-- Dynamic Typing Start -->

<script type="text/javascript">
  document.addEventListener("DOMContentLoaded", function () {
    var el = document.querySelector(".intro-text");
    if (!el) return;
    // header-text: one phrase, a list of phrases, or {en: ..., cs: ...} with those;
    // a random phrase of the current language is typed, again after switching language
    var headerText = {{ header_text | jsonify }};
    var timer;
    var cursor = document.createElement("span");
    cursor.className = "typed-cursor";
    cursor.setAttribute("aria-hidden", "true");
    cursor.textContent = "|";
    el.after(cursor);

    // Characters as people see them, so an emoji (even 👩‍🔬 or a flag) is typed at once
    function characters(text) {
      if (window.Intl && Intl.Segmenter) {
        return Array.from(new Intl.Segmenter(undefined, { granularity: "grapheme" }).segment(text), function (s) {
          return s.segment;
        });
      }
      return Array.from(text);
    }

    function typePhrase(delay) {
      var lang = document.documentElement.getAttribute("data-lang") || "en";
      var phrases = headerText;
      if (phrases && !Array.isArray(phrases) && typeof phrases === "object") {
        phrases = phrases[lang] || phrases.en || phrases.cs;
      }
      phrases = [].concat(phrases);
      var chars = characters(String(phrases[Math.floor(Math.random() * phrases.length)] || ""));
      var i = 0;
      clearTimeout(timer);
      el.textContent = "";
      function step() {
        el.textContent += chars[i++];
        if (i < chars.length) timer = setTimeout(step, 50);
      }
      if (chars.length) timer = setTimeout(step, delay);
    }
    typePhrase(1000);
    document.addEventListener("langchange", function () {
      typePhrase(0);
    });
  });
</script>

<!-- Dynamic Typing End  -->
